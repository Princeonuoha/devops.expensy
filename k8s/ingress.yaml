apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expensy-ingress
  namespace: student-prince
  annotations:
    cert-manager.io/issuer: letsencrypt
spec:
  ingressClassName: nginx

  tls:
  - hosts:
      - expensy.example.com
    secretName: expensy-tls

  rules:
  - host: expensy.57.156.40.50.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000