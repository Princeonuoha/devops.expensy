name: Expensy CI/CD

on:
  push:
    branches:
      - main
      - feature/expensy-devops
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build backend
        working-directory: ./expensy_backend
        run: |
          npm ci
          npm run build

      - name: Install and build frontend
        working-directory: ./expensy_frontend
        run: |
          npm install
          npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./expensy_backend
          push: true
          tags: princeonuoha/expensy-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./expensy_frontend
          push: true
          tags: princeonuoha/expensy-frontend:latest

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/ -n student-prince
          kubectl rollout restart deployment/backend -n student-prince
          kubectl rollout restart deployment/frontend -n student-prince

      - name: Verify deployment
        run: |
          kubectl get pods -n student-prince
          kubectl get svc -n student-prince
