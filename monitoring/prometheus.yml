global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "expensy-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8706"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "kubernetes-pods"
    kubernetes_sd_configs:
      - role: pod