apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: student-prince
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "expensy-backend"
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:8706"]
